name: wordle-ml

services:
  web:
    image: wordle-ml:web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      WEB_ADDR: ":8080"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8082}:8080"
    restart: unless-stopped

  tensorboard:
    image: tensorflow/tensorflow:2.20.0
    entrypoint: ["tensorboard"]
    command:
      - "--logdir=/logs"
      - "--host=0.0.0.0"
      - "--port=6006"
      - "--reload_interval=2"
    ports:
      - "127.0.0.1:${TENSORBOARD_HOST_PORT:-6007}:6006"
    volumes:
      - type: bind
        source: ./data/tensorboard
        target: /logs
        read_only: true
    restart: unless-stopped

  wordleml:
    image: wordle-ml:cuda13.1
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DOCKERCOMPOSE_UID: ${DOCKERCOMPOSE_UID:-1000}
        DOCKERCOMPOSE_GID: ${DOCKERCOMPOSE_GID:-1000}
    working_dir: /workspace/wordleml
    volumes:
      - type: bind
        source: .
        target: /workspace
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GOMLX_BACKEND: xla:cuda
      GOMLX_NO_AUTO_INSTALL: "1"
      WORDLEML_DATA_DIR: /workspace/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_DEVICE_ID:?Set NVIDIA_GPU_DEVICE_ID in .env to the RTX 5070 Ti UUID}"]
              capabilities: [gpu]
    init: true
    stdin_open: true
    tty: true
    command: ["go", "run", "./cmd/smoke"]
