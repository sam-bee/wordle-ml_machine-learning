name: wordle-ml

x-wordleml-common: &wordleml-common
  image: wordle-ml:cuda13.1
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      DOCKERCOMPOSE_UID: ${DOCKERCOMPOSE_UID:-1000}
      DOCKERCOMPOSE_GID: ${DOCKERCOMPOSE_GID:-1000}
  working_dir: /workspace/wordleml
  volumes:
    - type: bind
      source: .
      target: /workspace
    - type: bind
      source: ../wordle-ml_synthetic-data-creation
      target: /dependencies/wordle-ml_synthetic-data-creation
      read_only: true
    - type: bind
      source: ../wordle-ml_game-engine
      target: /dependencies/wordle-ml_game-engine
      read_only: true
  environment:
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    GOMLX_BACKEND: xla:cuda
    GOMLX_NO_AUTO_INSTALL: "1"
    WORDLEML_DATA_DIR: /workspace/data
    WORDLEML_MACHINE_LEARNING_REPO_DIR: /workspace
    WORDLEML_SYNTHETIC_REPO_DIR: /dependencies/wordle-ml_synthetic-data-creation
    WORDLEML_GAME_ENGINE_REPO_DIR: /dependencies/wordle-ml_game-engine
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${NVIDIA_GPU_DEVICE_ID:?Set NVIDIA_GPU_DEVICE_ID in .env to one approved RTX 5070 Ti or RTX 5050 UUID}"]
            capabilities: [gpu]
  init: true

services:
  web:
    image: wordle-ml:web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      WEB_ADDR: ":8080"
      INFERENCE_URL: "http://inference:8090"
    depends_on:
      inference:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8082}:8080"
    restart: unless-stopped

  tensorboard:
    image: tensorflow/tensorflow:2.20.0
    entrypoint: ["tensorboard"]
    command:
      - "--logdir=/logs"
      - "--host=0.0.0.0"
      - "--port=6006"
      - "--reload_interval=2"
      # The standard loader can still recover scalar histories from retained
      # pre-fix runs whose histograms were accidentally labelled as audio.
      - "--load_fast=false"
    ports:
      - "127.0.0.1:${TENSORBOARD_HOST_PORT:-6007}:6006"
    volumes:
      - type: bind
        # Proof runs write one self-contained event directory per run.  Mount
        # the parent so TensorBoard can show and compare all of them.
        source: ./runs
        target: /logs
        read_only: true
    restart: unless-stopped

  wordleml:
    <<: *wordleml-common
    stdin_open: true
    tty: true
    command: ["go", "run", "./cmd/smoke"]

  inference:
    <<: *wordleml-common
    command: ["go", "run", "./cmd/serve", "-run-id=${WORDLEML_INFERENCE_RUN_ID:-proof-full-20260808}", "-addr=:8090"]
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 30s
    restart: unless-stopped
