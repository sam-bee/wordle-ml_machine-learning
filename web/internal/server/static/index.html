<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Wordle ML project visualisation">
    <title>Wordle ML</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Go · GoMLX · CUDA</p>
        <div class="wordmark" aria-hidden="true">
          <span class="tile correct">W</span>
          <span class="tile present">O</span>
          <span class="tile absent">R</span>
          <span class="tile correct">D</span>
          <span class="tile present">L</span>
          <span class="tile correct">E</span>
        </div>
        <h1 id="page-title">Teaching a machine to play Wordle.</h1>
        <p class="lede">
          This will become the project visualiser. For now, the model is still
          learning how to get started—and so is this page.
        </p>
        <div class="status-row" aria-label="Project status">
          <span><i class="status-dot"></i>Infrastructure ready</span>
          <span>Model coming next</span>
        </div>
      </section>
    </main>
  </body>
</html>
